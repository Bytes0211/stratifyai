name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-and-tests:
    name: Quality And Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Black format check
        continue-on-error: true
        run: uv run black --check .

      - name: Ruff lint
        continue-on-error: true
        run: uv run ruff check .

      - name: Mypy type check
        continue-on-error: true
        run: uv run mypy stratifyai cli api

      - name: Run tests with coverage threshold
        run: uv run pytest --cov=stratifyai --cov-report=term-missing --cov-fail-under=65 -m "not integration"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend into api/static/dist
        run: npm run build --prefix frontend

  integration-tests:
    name: Integration Tests (Real Providers)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets['OPENAI_API_KEY'] }}
          ANTHROPIC_API_KEY: ${{ secrets['ANTHROPIC_API_KEY'] }}
          GOOGLE_API_KEY: ${{ secrets['GOOGLE_API_KEY'] }}
        run: uv run pytest -m integration -v
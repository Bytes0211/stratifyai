name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Quality And Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Detect changed Python files (PR only)
        if: github.event_name == 'pull_request'
        id: changed_py
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.py

      - name: Ruff format check (PR strict, changed files)
        if: github.event_name == 'pull_request' && steps.changed_py.outputs.any_changed == 'true'
        run: uv run ruff format --check ${{ steps.changed_py.outputs.all_changed_files }}

      - name: Ruff lint (PR strict, changed files)
        if: github.event_name == 'pull_request' && steps.changed_py.outputs.any_changed == 'true'
        run: uv run ruff check ${{ steps.changed_py.outputs.all_changed_files }}

      - name: Mypy type check (PR strict, changed project files)
        if: github.event_name == 'pull_request' && steps.changed_py.outputs.any_changed == 'true'
        run: |
          TARGETS="$(echo "${{ steps.changed_py.outputs.all_changed_files }}" | tr ' ' '\n' | grep -E '^(stratifyai|cli|api)/.*\.py$' || true)"
          if [ -z "$TARGETS" ]; then
            echo "No changed Python files under stratifyai/ cli/ or api/ for mypy."
            exit 0
          fi
          uv run mypy $TARGETS

      - name: No Python file changes in PR
        if: github.event_name == 'pull_request' && steps.changed_py.outputs.any_changed != 'true'
        run: echo "No Python files changed; strict Ruff format/lint and Mypy checks skipped for PR."

      - name: Ruff format check (push/manual advisory)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run ruff format --check .

      - name: Ruff lint (push/manual advisory)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run ruff check .

      - name: Mypy type check (push/manual advisory)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run mypy stratifyai cli api

      - name: Run tests with coverage threshold
        run: uv run pytest --cov=stratifyai --cov-report=term-missing --cov-fail-under=65 -m "not integration"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend into api/static/dist
        run: npm run build --prefix frontend

  integration-tests:
    name: Integration Tests (Real Providers)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets['OPENAI_API_KEY'] }}
          ANTHROPIC_API_KEY: ${{ secrets['ANTHROPIC_API_KEY'] }}
          GOOGLE_API_KEY: ${{ secrets['GOOGLE_API_KEY'] }}
        run: uv run pytest -m integration -v